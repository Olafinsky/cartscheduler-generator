plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.cartscheduler'
version = providers.gradleProperty('releaseVersion').getOrElse('1.0.0-SNAPSHOT')
description = 'Generator arkuszy z kandydatami dla CartScheduler'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'cartscheduler-generator'

            pom {
                name = 'CartScheduler Generator'
                description = project.description
                url = 'https://github.com/Olafinsky/cartscheduler-generator'
            }
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/olafinsky/cartscheduler-generator')
            credentials {
                username = providers.gradleProperty('gpr.user').getOrNull() ?: System.getenv('GITHUB_ACTOR')
                password = providers.gradleProperty('gpr.key').getOrNull() ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
